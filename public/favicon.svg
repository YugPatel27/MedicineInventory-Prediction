<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="13" fill="url(#bg)"/>
  <!-- Medical cross, slightly slimmer to leave room for the leaf accent -->
  <rect x="20" y="11" width="8" height="26" rx="2.5" fill="#ffffff"/>
  <rect x="11" y="20" width="26" height="8" rx="2.5" fill="#ffffff"/>
  <!-- Leaf accent wrapping the lower-right of the cross: signals the
       natural / apothecary side of the brand alongside the clinical cross. -->
  <path d="M24 30.5c0-6 5-10.5 10.5-10.5 0 6-4.5 10.5-10.5 10.5z" fill="url(#leafGrad)"/>
  <path d="M24.6 30.4c2.2-4.6 5.9-7.7 9.4-9.4" stroke="#065f46" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.55"/>
</svg>
