<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>MediStock — Medicine Stock Intelligence</title>
    <meta name="description" content="MediStock is a professional, local-first medicine inventory platform for hospitals, pharmacies, and clinics. Track stock, expiry dates, demand forecasting, and generate reports." />
    <meta name="keywords" content="medicine inventory, pharmacy management, expiry management, stock alerts, demand forecasting, hospital software, healthcare ERP, MediStock" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="MediStock Healthcare" />

    <!-- Theme — brand dark green, and light-only so native form controls
         (select dropdowns, date pickers) never render with the OS dark
         palette, which was making selected option text invisible. -->
    <meta name="theme-color" content="#066046" />
    <meta name="color-scheme" content="light" />

    <!-- Open Graph -->
    <meta property="og:title" content="MediStock — Medicine Inventory Intelligence" />
    <meta property="og:description" content="Professional medicine inventory, expiry control, analytics and forecasting for hospitals and pharmacies." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MediStock — Medicine Inventory Intelligence" />
    <meta name="twitter:description" content="Local-first medicine inventory for pharmacies and hospitals." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Use the system font stack to keep the initial render fast and avoid
         a third-party font CSS dependency on the critical path. -->
    <style>
      html { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
